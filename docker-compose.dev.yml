services:
  app:
    container_name: metamcp-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "12008:12008"
      - "12009:12009"
    volumes:
      # Mount source code for hot reloading
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/backend/node_modules
      - /app/packages/trpc/node_modules
      - /app/packages/zod-types/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/typescript-config/node_modules
      # Docker-based STDIO servers (github-mcp-server, sonarqube) run `docker run`
      # inside this container, so it needs access to the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: mount a local custom MCP server project that isn't an
      # installable npm/docker package (e.g. a private QuickBooks MCP
      # server). Set QUICKBOOKS_MCP_PATH in your own .env to your project's
      # path; the container always sees it at the fixed path below, so the
      # server's command in the metamcp UI should reference that fixed path
      # regardless of where the project actually lives on your host. If
      # unset, this mounts an empty placeholder directory — harmless no-op.
      - ${QUICKBOOKS_MCP_PATH:-./local-mcp-servers/quickbooks}:/mcp-servers/quickbooks:ro
    environment:
      # pnpm runs non-interactively here (detached compose has no TTY). Without
      # CI=true, a `pnpm install` that needs to purge node_modules aborts with
      # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY and kills the container.
      CI: "true"
      # Overrides the "production" value from .env — running `next dev` with
      # NODE_ENV=production is non-standard and Next.js warns on every boot.
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-all}
      # Postgres connection details
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      
      # Database configuration (composed from above vars)
      DATABASE_URL: postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}
      
      # Application URL configuration
      APP_URL: ${APP_URL:-http://localhost:12008}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      
      # Auth configuration
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-super-secret-key-change-this-in-production}
      
      # Docker networking fix
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - metamcp-network

  postgres:
    image: postgres:16-alpine
    container_name: metamcp-pg-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-9433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metamcp-network

volumes:
  # Own volume by default so a fresh clone works standalone — `external: true`
  # here would fail outright unless the prod stack's `metamcp_postgres_data`
  # volume already exists. If you want dev and prod to share data on the same
  # machine, change this locally to `external: true` / `name: metamcp_postgres_data`
  # instead of committing that as the default.
  postgres_data_dev:
    driver: local

networks:
  metamcp-network:
    driver: bridge 